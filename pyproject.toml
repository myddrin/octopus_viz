[tool.poetry]
name = "octopus-viz"
version = "0.2.1"
description = ""
authors = ["Thomas Richard <thomrich0@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"

Django = "6.0"
requests = "2.32.5"
pytz = "2025.2"  # TODO(tr) switch to timzone
django-bootstrap5 = "25.3"

[tool.poetry.group.dev.dependencies]
pytest = "9.0.1"
pytest-django = "4.11.1"
pytest-random-order = "1.2.0"
changelog_gen = {version="~0.13", extras=["bump-my-version"]}
pre-commit = "4.5.0"

[tool.changelog_gen]
commit = true
release = true
allow_dirty = false
current_version = "0.2.1"
allowed_branches = ["master"]

[[tool.changelog_gen.files]]
filename = "README.md"

[[tool.changelog_gen.files]]
filename = "pyproject.toml"
pattern = 'version = "{version}"'

[tool.pytest.ini_options]
addopts = [
  "--random-order"
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
