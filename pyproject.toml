[project]
name = "octopus-viz"
version = "0.2.1"
description = ""
authors = [{ name = "Thomas Richard", email = "thomrich0@gmail.com" }]
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = [
    "Django==5.2.8",
    "requests==2.32.5",
    "pytz==2025.2",  # TODO(tr) switch to timezone
    "django-bootstrap5==25.3",
]

[dependency-groups]
dev = [
    "pytest==9.0.1",
    "pytest-django==4.11.1",
    "pytest-random-order==1.2.0",
    "changelog_gen==0.13.8",
    "pre-commit==4.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.changelog_gen]
commit = true
release = true
allow_dirty = false
current_version = "0.2.1"
allowed_branches = ["master"]

[[tool.changelog_gen.files]]
filename = "README.md"

[[tool.changelog_gen.files]]
filename = "pyproject.toml"
pattern = 'version = "{version}"'

[tool.pytest.ini_options]
addopts = [
  "--random-order"
]
